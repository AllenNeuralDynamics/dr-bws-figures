name: Update session IDs

on:
  push:
    paths:
      - src/dr_bws/datacube.py
      - scripts/dump_datacube_sessions.py
      - .github/workflows/update-datacube-sessions.yml

permissions:
  contents: write
  id-token: write

jobs:
  update-session-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: uv sync --locked --all-extras

      - name: Configure aws credentials
        env:
          AWS_IAM_ROLE: ${{ vars.AWS_IAM_ROLE }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Run script
        env:
          CODE_OCEAN_API_TOKEN: ${{ secrets.CODE_OCEAN_API_TOKEN }}
          CODE_OCEAN_DOMAIN: ${{ secrets.CODE_OCEAN_DOMAIN }}
        run: uv run python scripts/dump_datacube_sessions.py

      - name: Commit and push updated session IDs
        run: |
          if git ls-files --error-unmatch assets/datacube_sessions.csv >/dev/null 2>&1 && git diff --quiet -- assets/datacube_sessions.csv; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/datacube_sessions.csv
          git commit -m "Update session IDs [skip ci]"
          git push
