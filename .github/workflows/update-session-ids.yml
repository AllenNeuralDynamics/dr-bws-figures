name: Update session IDs

on:
  push:
    paths:
      - src/dr_bws/sessions.py

permissions:
  contents: write

jobs:
  update-session-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: uv sync --locked
      - run: uv run python scripts/dump_session_ids.py

      - name: Commit and push updated session IDs
        run: |
          if git ls-files --error-unmatch assets/session_ids.json >/dev/null 2>&1 && git diff --quiet -- assets/session_ids.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/session_ids.json
          git commit -m "Update session IDs [skip ci]"
          git push
